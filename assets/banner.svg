<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Rail Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="greenCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-rail {
      stroke-dasharray: 8 16;
      animation: dashMove 4s linear infinite;
    }
    .pulse-rail-fast {
      stroke-dasharray: 6 12;
      animation: dashMoveFast 2.5s linear infinite;
    }
    .pulse-node {
      animation: nodePulse 2s ease-in-out infinite alternate;
    }
    .pulse-node-delayed {
      animation: nodePulse 2s ease-in-out 1s infinite alternate;
    }
    .orbit-circle {
      transform-origin: 1050px 190px;
      animation: spin 16s linear infinite;
    }
    .floating-badge {
      animation: floatBadge 3s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashMoveFast {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -200; }
    }
    @keyframes nodePulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Cyber Grid -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="900" y1="0" x2="900" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Real-Time Money Flow Rails -->
  <path d="M -50 100 C 300 20, 600 220, 1250 80" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="3" opacity="0.6" filter="url(#glowLight)" class="pulse-rail" />
  <path d="M -50 280 C 400 350, 700 120, 1250 260" fill="none" stroke="url(#greenCyanGrad)" stroke-width="3.5" opacity="0.7" filter="url(#glowLight)" class="pulse-rail-fast" />
  <path d="M 100 380 C 500 200, 800 340, 1150 -20" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" class="pulse-rail" />

  <!-- Orbiting Real-Time Ecosystem Graphic (Right Side) -->
  <g transform="translate(1000, 190)">
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="46" fill="#0f172a" stroke="url(#cyanPurpleGrad)" stroke-width="3" filter="url(#glow)" />
    <text x="0" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">RTP</text>
    
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#334155" stroke-dasharray="4 6" stroke-width="1.5" />
    
    <!-- Floating Satellites -->
    <g class="orbit-circle">
      <circle cx="85" cy="0" r="14" fill="#065f46" stroke="#34d399" stroke-width="2" filter="url(#glowLight)" />
      <text x="85" y="4" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ecfdf5" text-anchor="middle">FED</text>
      
      <circle cx="-85" cy="0" r="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glowLight)" />
      <text x="-85" y="4" font-family="sans-serif" font-size="9" font-weight="bold" fill="#e0e7ff" text-anchor="middle">ISO</text>

      <circle cx="0" cy="85" r="14" fill="#0f766e" stroke="#2dd4bf" stroke-width="2" filter="url(#glowLight)" />
      <text x="0" y="89" font-family="sans-serif" font-size="8" font-weight="bold" fill="#f0fdfa" text-anchor="middle">API</text>

      <circle cx="0" cy="-85" r="14" fill="#581c87" stroke="#c084fc" stroke-width="2" filter="url(#glowLight)" />
      <text x="0" y="-81" font-family="sans-serif" font-size="8" font-weight="bold" fill="#faf5ff" text-anchor="middle">24/7</text>
    </g>
  </g>

  <!-- Left / Main Header Content -->
  <g transform="translate(60, 85)">
    <!-- Category Badge -->
    <g class="floating-badge">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#10b981" class="pulse-node" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">⚡ INSTANT PAYMENTS &amp; RAILS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Real-Time
    </text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Payments Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated ecosystem of SaaS &amp; Open-Source Rails, FedNow, RTP, ISO 20022 &amp; Payment Orchestration
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 200)">
      <!-- Tag 1: FedNow & RTP -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="65" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ FedNow / RTP</text>

      <!-- Tag 2: ISO 20022 -->
      <rect x="140" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="197" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📜 ISO 20022</text>

      <!-- Tag 3: Orchestration -->
      <rect x="265" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="337" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔄 Orchestration</text>

      <!-- Tag 4: Ledgers -->
      <rect x="420" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="482" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Real-Time Ledgers</text>

      <!-- Tag 5: 24/7/365 -->
      <rect x="555" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="610" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">🟢 24/7/365</text>
    </g>
  </g>
</svg>
